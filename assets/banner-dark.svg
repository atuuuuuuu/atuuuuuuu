<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="atu: 3rd-year student at New Mongol College of Technology. Builds tools, makes beats.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="0.55" stop-color="#0f1534"/>
      <stop offset="1" stop-color="#1b1446"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.35" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#7fd3ff"/>
      <stop offset="0.45" stop-color="#2f6fe0"/>
      <stop offset="1" stop-color="#11205e"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4b8dff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4b8dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9cc8ff"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#ff8a3d"/>
      <stop offset="0.75" stop-color="#ffcf5c"/>
      <stop offset="1" stop-color="#ffcf5c" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="front"><rect x="780" y="160" width="330" height="60"/></clipPath>
    <clipPath id="round"><rect width="1200" height="320" rx="22"/></clipPath>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .star { fill: #fff; animation: tw 4s ease-in-out infinite; }
      .s2 { animation-delay: 1.3s; } .s3 { animation-delay: 2.6s; }
      @keyframes tw { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
      .orbit { transform-origin: 945px 160px; animation: spin 26s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }
      .bar { transform-box: fill-box; transform-origin: center; animation: eq 1.6s ease-in-out infinite; }
      @keyframes eq { 0%, 100% { transform: scaleY(.45) } 50% { transform: scaleY(1) } }
      @media (prefers-reduced-motion: reduce) { .star, .orbit, .bar { animation: none } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- stars -->
    <g>
      <circle class="star" cx="80" cy="40" r="1.4"/><circle class="star s2" cx="190" cy="270" r="1.1"/>
      <circle class="star s3" cx="320" cy="30" r="1.2"/><circle class="star" cx="460" cy="290" r="1"/>
      <circle class="star s2" cx="540" cy="52" r="1.5"/><circle class="star s3" cx="640" cy="250" r="1.1"/>
      <circle class="star" cx="720" cy="36" r="1"/><circle class="star s2" cx="790" cy="292" r="1.3"/>
      <circle class="star s3" cx="1120" cy="40" r="1.4"/><circle class="star" cx="1160" cy="250" r="1.1"/>
      <circle class="star s2" cx="1060" cy="295" r="1"/><circle class="star s3" cx="610" cy="140" r="0.9"/>
      <circle class="star" cx="40" cy="190" r="1"/><circle class="star s3" cx="1180" cy="140" r="0.9"/>
    </g>

    <!-- planet with orbit -->
    <circle cx="945" cy="160" r="150" fill="url(#glow)"/>
    <ellipse cx="945" cy="160" rx="150" ry="38" fill="none" stroke="#9cc8ff" stroke-opacity=".35" stroke-width="1.5" transform="rotate(-14 945 160)"/>
    <circle cx="945" cy="160" r="86" fill="url(#planet)"/>
    <path d="M880 130 q30 -18 60 -6 t52 4" fill="none" stroke="#bfe6ff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
    <path d="M890 190 q40 14 80 0" fill="none" stroke="#bfe6ff" stroke-opacity=".25" stroke-width="3" stroke-linecap="round"/>
    <g transform="rotate(-14 945 160)"><ellipse cx="945" cy="160" rx="150" ry="38" fill="none" stroke="#9cc8ff" stroke-opacity=".35" stroke-width="1.5" clip-path="url(#front)"/></g>
    <g class="orbit"><circle cx="1095" cy="160" r="6" fill="#ffcf5c"/></g>

    <!-- text -->
    <text class="t" x="72" y="128" font-size="84" font-weight="800" fill="url(#name)" letter-spacing="-2">atu</text>
    <text class="t" x="76" y="172" font-size="24" font-weight="600" fill="#dbe7ff">3rd-year student · New Mongol College of Technology</text>
    <text class="t" x="76" y="208" font-size="19" fill="#93a3c9">I build small tools that make computers nicer, and I make beats.</text>

    <!-- sound bars -->
    <g fill="url(#wave)">
      <rect class="bar" x="76"  y="236" width="6" height="34" rx="3"/>
      <rect class="bar" x="88"  y="230" width="6" height="46" rx="3" style="animation-delay:.2s"/>
      <rect class="bar" x="100" y="240" width="6" height="26" rx="3" style="animation-delay:.4s"/>
      <rect class="bar" x="112" y="226" width="6" height="54" rx="3" style="animation-delay:.1s"/>
      <rect class="bar" x="124" y="236" width="6" height="34" rx="3" style="animation-delay:.5s"/>
      <rect class="bar" x="136" y="232" width="6" height="42" rx="3" style="animation-delay:.3s"/>
      <rect class="bar" x="148" y="242" width="6" height="22" rx="3" style="animation-delay:.6s"/>
    </g>
    <text class="t" x="170" y="259" font-size="15" fill="#6f7fa8" letter-spacing="2">SWIFT · JAVASCRIPT · PYTHON · BEATS</text>
  </g>
</svg>
