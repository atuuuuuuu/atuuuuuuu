<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="t">
  <title id="t">Hey, I'm Usukhbayar. Student in Ulaanbaatar, Mongolia, building small tools for the Mac and the browser.</title>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <radialGradient id="fade" cx="30%" cy="45%" r="80%">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gm"><rect width="960" height="320" fill="url(#fade)"/></mask>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="64"/></filter>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".65" stop-color="#ffffff"/><stop offset="1" stop-color="#9aa4b2"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#4c8dff" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#2bb5ad" stop-opacity=".45"/>
    </linearGradient>
    <clipPath id="clip"><rect width="960" height="320" rx="20"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .o1 { animation: d1 16s ease-in-out infinite alternate; }
    .o2 { animation: d2 20s ease-in-out infinite alternate; }
    @keyframes d1 { to { transform: translate(120px, 50px); } }
    @keyframes d2 { to { transform: translate(-150px, -40px); } }
    .line { opacity: 0; animation: cyc 12s infinite; }
    .l2 { animation-delay: 4s; } .l3 { animation-delay: 8s; }
    @keyframes cyc { 0% { opacity: 0; transform: translateY(8px); } 4%, 30% { opacity: 1; transform: none; } 34%, 100% { opacity: 0; transform: translateY(-8px); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .float { animation: fl 7s ease-in-out infinite alternate; }
    @keyframes fl { to { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) {
      .o1, .o2, .float, .cursor { animation: none; }
      .line { animation: none; opacity: 0; } .l1 { opacity: 1; }
    }
  </style>

  <g clip-path="url(#clip)">
    <rect width="960" height="320" fill="#0b0e14"/>
    <circle class="o1" cx="170" cy="70" r="150" fill="#4c8dff" opacity=".22" filter="url(#blur)"/>
    <circle class="o2" cx="830" cy="270" r="170" fill="#2bb5ad" opacity=".18" filter="url(#blur)"/>
    <rect width="960" height="320" fill="url(#grid)" mask="url(#gm)"/>
  </g>
  <rect x=".5" y=".5" width="959" height="319" rx="20" fill="none" stroke="url(#edge)"/>

  <rect x="48" y="40" width="262" height="32" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
  <circle cx="66" cy="56" r="4" fill="#2bb5ad"/>
  <text x="80" y="61" class="mono" font-size="13" fill="#7d8590">atu · ulaanbaatar, mongolia</text>

  <text x="45" y="160" class="sans" font-size="60" font-weight="700" letter-spacing="-2" fill="url(#name)">Hey, I'm Usukhbayar.</text>

  <g class="mono" font-size="19">
    <text x="48" y="226" fill="#7d8590">~</text>
    <text x="66" y="226" fill="#4c8dff">❯</text>
    <g fill="#e6edf3">
      <text class="line l1" x="92" y="226">building small tools for the Mac<tspan class="cursor" fill="#2bb5ad"> ▌</tspan></text>
      <text class="line l2" x="92" y="226">keeping your data on your device<tspan class="cursor" fill="#2bb5ad"> ▌</tspan></text>
      <text class="line l3" x="92" y="226">studying at NMCT, 3rd year<tspan class="cursor" fill="#2bb5ad"> ▌</tspan></text>
    </g>
  </g>

  <g class="float">
    <rect x="610" y="56" width="302" height="162" rx="14" fill="#141923" fill-opacity=".78" stroke="#ffffff" stroke-opacity=".12"/>
    <circle cx="632" cy="78" r="5" fill="#ff5f57"/><circle cx="650" cy="78" r="5" fill="#febc2e"/><circle cx="668" cy="78" r="5" fill="#28c840"/>
    <text x="896" y="82" text-anchor="end" class="mono" font-size="11" fill="#7d8590">~/Developer</text>
    <line x1="610" y1="96" x2="912" y2="96" stroke="#ffffff" stroke-opacity=".1"/>
    <g class="mono" font-size="14" fill="#e6edf3">
      <circle cx="634" cy="124" r="4" fill="#4c8dff"/><text x="650" y="129">Convrt</text><text x="896" y="129" text-anchor="end" font-size="11" fill="#7d8590">Swift</text>
      <circle cx="634" cy="156" r="4" fill="#2bb5ad"/><text x="650" y="161">unpacked</text><text x="896" y="161" text-anchor="end" font-size="11" fill="#7d8590">TypeScript</text>
      <circle cx="634" cy="188" r="4" fill="#e8743b"/><text x="650" y="193">earth-jukebox</text><text x="896" y="193" text-anchor="end" font-size="11" fill="#7d8590">JavaScript</text>
    </g>
  </g>

  <text x="912" y="282" text-anchor="end" class="mono" font-size="13" fill="#7d8590">github.com/atuuuuuuu</text>
</svg>
